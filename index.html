<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="conatiner">
      <div class="main-container">
        <div class="box">
          <ul class="list-box">
            <li></li>
            <li></li>
          </ul>
          <div>
            <div>
              <span class="timeConatiner"></span
              ><span class="timeConatiner"></span
              ><span class="timeConatiner"></span> AM
            </div>
            <button class="btn">light-Mode</button>
            <select name="timezone" id="select">
              <option value="" selected disabled>Chose</option>
              <option value="240">America</option>
              <option value="-480">China</option>
              <option value="-330">India</option>
              <option value="-300">Pakistan</option>
              <option value="-180">Saud-e-Arabia</option>
              <option value="-240">U.A.E.</option>
              <option value="-480">Philipines</option>
              <option value="-345">Nepal</option>
              <option value="-30">Bhutan</option>
              <option value="-390">Myanmar</option>
              <option value="-60">UK</option>
              <option value="240">Canada</option>
              <option value="-600">Austrailia</option>
              <option value="-720">New Zeland</option>
              <option value="0">BurkinaFaso</option>
              <option value="-240">Oman</option>
              <option value="-180">Yemen</option>
              <option value="-270">Afghanistan</option>
              <option value="-180">Russia</option>
              <option value="-120">Germany</option>
              <option value="-120">Italy</option>
              <option value="-180">Bharine</option>
            </select>
            <div class="timeZone-box">
              <span>Time zone is: <span class="time-zone-value"></span> </span>
            </div>
            <div class="stop-watch">
              <div class="stop-watch--container">
                <div class="stopwatch-content">0</div>
              </div>
              <button class="stop-btn">stop-watch</button>
            </div>
            <div class="countdown-timer">
              <span>CountDown: <span class="countDown-content"></span></span>
            </div>
            <div class="alarm-box">
              <audio controls class="audioSound">
                <source class="audio-source" src="/assets/Nebulite - A New Day (freetouse.com).mp3" type="audio/mpeg" />
              </audio>
              <select name="" id="alarm-minutes--slct">
                <option selected disabled value="">00</option>
                <option value="10">10/option>
                <option value="20">20</option>
                <option value="0">30</option>
                <option value="40">40</option>
                <option value="50">50</option>
                <option value="60">60</option>
              </select>
              <select name="" id="alarm-am-pm--slct">
                <option value="" selected disabled>AM / PM</option>
                <option value="Am">AM</option>
                <option value="PM">PM</option>
              </select>
              <div class="alarm-btn--box">
                <button class="alarmCnacel-btn">Cancel</button>
                <button class="alarmConfirm-btn">Confirm</button>
                <span class="alarm-content"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="/script/script.js"></script>
  </body>
</html>
